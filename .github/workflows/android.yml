name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # compileSdk 36 플랫폼이 러너 이미지에 없을 수 있어 라이선스까지 함께 맞춘다.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # Gradle 은 테스트가 통과하면 아무것도 출력하지 않는다. 소스가 빠져서
      # "0개 통과"로 초록불이 뜨는 상황을 구분하려면 결과를 직접 세야 한다.
      - name: Summarize test results
        if: always()
        run: |
          dir=app/build/test-results/testDebugUnitTest
          if ! ls "$dir"/*.xml >/dev/null 2>&1; then
            echo "::error::테스트 결과 XML이 없다 — 테스트가 실행되지 않았다"
            exit 1
          fi
          count() {
            grep -ho "$1=\"[0-9]*\"" "$dir"/*.xml \
              | tr -dc '0-9\n' | awk '{s+=$1} END {print s+0}'
          }
          total=$(count tests)
          echo "실행된 테스트 ${total}개 · 실패 $(count failures)개 · 오류 $(count errors)개 · 건너뜀 $(count skipped)개"
          if [ "$total" -eq 0 ]; then
            echo "::error::실행된 테스트가 없다"
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/
          if-no-files-found: warn

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nuguyo-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
